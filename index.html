<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ikigai Agencia</title>
    <script>
      // Aplica el theme antes del primer paint para evitar flash blanco/negro.
      try {
        var t = localStorage.getItem('p360-theme') === 'light' ? 'light' : 'dark';
        document.documentElement.classList.add('theme-' + t);
      } catch (e) { document.documentElement.classList.add('theme-dark'); }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
