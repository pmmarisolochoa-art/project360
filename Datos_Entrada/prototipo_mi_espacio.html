<title>Mi Espacio por Rol</title>
<style>
  :root {
    --rojo: #E11822; --rojo-suave: #E1182214; --negro: #0B0B0B; --plomo: #686868;
    --plomo-claro: #9A9A9A; --hueso: #F7F7F7; --borde: #E7E5E2; --superficie: #FFFFFF;
    --verde: #1B8A4C; --verde-bg: #1B8A4C14; --ambar: #B5790A; --ambar-bg: #B5790A14;
    --azul: #2563A8; --azul-bg: #2563A814;
    --sombra: 0 1px 2px rgba(11,11,11,0.04), 0 8px 24px -12px rgba(11,11,11,0.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--hueso); color: var(--negro); font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  h1, h2, .marca { font-family: 'Montserrat', 'Inter', sans-serif; text-wrap: balance; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 24px 64px; }

  .proto-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .proto-tag { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--plomo); font-weight: 600; }
  .proto-title { font-size: 20px; font-weight: 800; margin: 2px 0 0; }

  .switcher { display: inline-flex; gap: 4px; background: var(--superficie); border: 1px solid var(--borde); border-radius: 12px; padding: 4px; box-shadow: var(--sombra); }
  .switcher button { appearance: none; border: none; background: transparent; font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--plomo); padding: 9px 15px; border-radius: 9px; cursor: pointer; transition: background .15s, color .15s; display: flex; align-items: center; gap: 7px; }
  .switcher button.on { background: var(--negro); color: #fff; }
  .switcher .av { height: 18px; width: 18px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; color: #fff; flex-shrink: 0; }

  .persona-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .persona-header .av-grande { height: 46px; width: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; color: #fff; flex-shrink: 0; }
  .persona-header h2 { font-size: 20px; margin: 0; }
  .persona-header .sub { font-size: 12.5px; color: var(--plomo); margin: 2px 0 0; }
  .persona-header .chip { font-size: 10.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--rojo-suave); color: var(--rojo); margin-left: auto; }

  .cajon-section { margin-bottom: 22px; }
  .cajon-section > .titulo { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .cajon-section > .titulo h2 { font-size: 14.5px; font-weight: 800; margin: 0; }
  .cajon-section > .titulo .n { font-size: 11.5px; color: var(--plomo); }

  .grid-semana { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .dia { background: var(--superficie); border: 1px solid var(--borde); border-radius: 12px; padding: 10px; min-height: 108px; box-shadow: var(--sombra); }
  .dia .d-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--plomo-claro); margin-bottom: 7px; }
  .dia .item { font-size: 11.5px; background: var(--hueso); border-radius: 7px; padding: 5px 7px; margin-bottom: 5px; line-height: 1.3; }
  .dia .item.reunion { background: var(--azul-bg); color: var(--azul); font-weight: 600; }
  .dia.hoy { border-color: var(--rojo); box-shadow: 0 0 0 1px var(--rojo); }

  .lista { display: flex; flex-direction: column; gap: 8px; }
  .fila {
    display: flex; align-items: center; gap: 11px; padding: 11px 14px;
    background: var(--superficie); border: 1px solid var(--borde); border-radius: 11px;
    box-shadow: var(--sombra); font-size: 13px;
  }
  .fila .dot { height: 8px; width: 8px; border-radius: 999px; flex-shrink: 0; }
  .fila .dot.urge { background: var(--rojo); }
  .fila .dot.ok { background: var(--verde); }
  .fila .titulo-f { flex: 1; min-width: 0; }
  .fila .titulo-f b { display: block; }
  .fila .meta { font-size: 11px; color: var(--plomo); margin-top: 1px; }
  .fila .badge { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 999px; flex-shrink: 0; white-space: nowrap; }
  .badge.vence { background: var(--ambar-bg); color: var(--ambar); }
  .badge.hoy { background: var(--rojo-suave); color: var(--rojo); }
  .badge.nuevo { background: var(--verde-bg); color: var(--verde); }

  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat { background: var(--superficie); border: 1px solid var(--borde); border-radius: 12px; padding: 13px 15px; box-shadow: var(--sombra); }
  .stat .l { font-size: 9.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--plomo); font-weight: 700; }
  .stat .v { font-size: 19px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat .v.good { color: var(--verde); }

  .vacio { font-size: 12px; color: var(--plomo-claro); font-style: italic; padding: 14px; text-align: center; background: var(--superficie); border: 1px dashed var(--borde); border-radius: 11px; }

  footer.note { margin-top: 24px; font-size: 11.5px; color: var(--plomo-claro); text-align: center; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --negro: #F2F2F0; --plomo: #ABABAB; --plomo-claro: #7A7A7A; --hueso: #141414;
      --borde: #2A2A2A; --superficie: #1C1C1C; --rojo-suave: #E1182222;
      --ambar-bg: #B5790A22; --verde-bg: #1B8A4C22; --azul-bg: #2563A822;
      --sombra: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
    :root:not([data-theme="light"]) .dia .item { background: #141414; }
  }
  :root[data-theme="dark"] {
    --negro: #F2F2F0; --plomo: #ABABAB; --plomo-claro: #7A7A7A; --hueso: #141414;
    --borde: #2A2A2A; --superficie: #1C1C1C; --rojo-suave: #E1182222;
    --ambar-bg: #B5790A22; --verde-bg: #1B8A4C22; --azul-bg: #2563A822;
    --sombra: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
  :root[data-theme="dark"] .dia .item { background: #141414; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<div class="wrap">
  <div class="proto-top">
    <div>
      <div class="proto-tag">Prototipo · Mi Espacio, por persona</div>
      <h1 class="proto-title">Lo que cada quien ve al entrar — solo lo suyo</h1>
    </div>
    <div class="switcher" id="switcher"></div>
  </div>

  <div class="persona-header">
    <div class="av-grande" id="pAvatar"></div>
    <div>
      <h2 id="pNombre"></h2>
      <p class="sub" id="pSub"></p>
    </div>
    <span class="chip">Cliente: Alejo Luengas</span>
  </div>

  <div id="contenido"></div>

  <footer class="note">Prototipo HTML — cada persona ve exactamente lo de arriba al entrar, filtrado por su nombre. Nada se comparte entre roles.</footer>
</div>

<script>
  const PERSONAS = {
    omar: {
      nombre: 'Omar (Rayo)', rol: 'Setter', color: '#2563A8', inicial: 'O',
      stats: [
        { l: 'Leads asignados', v: '14' },
        { l: 'Agendados esta semana', v: '5' },
        { l: 'Tasa de agenda', v: '36%', good: true },
        { l: 'Pendientes de contactar', v: '3' },
      ],
      urgentes: [
        { t: 'Contactar a Rafael Soto (DM directo, sin responder)', badge: 'Vence hoy', tono: 'hoy', urge: true },
        { t: 'Confirmar agenda de Enrique Carreño para mañana', badge: 'Vence mañana', tono: 'vence', urge: true },
      ],
      semana: [
        { d: 'Lun', items: ['3 leads nuevos'] },
        { d: 'Mar', items: ['Llamar a Rafael', 'Reunión equipo', true] },
        { d: 'Mié', items: ['2 agendas confirmadas'] },
        { d: 'Jue', items: [] },
        { d: 'Vie', items: ['Cierre de semana', true] },
      ],
      leads: [
        { n: 'Rafael Soto', f: 'DM directo', etapa: 'Nuevo' },
        { n: 'Enrique Carreño', f: 'Otro · score 47', etapa: 'Cita agendada' },
        { n: 'Miguel Perez Zabala', f: 'Sin datos extra', etapa: 'Nuevo' },
      ],
    },
    jessica: {
      nombre: 'Jessica Valdés', rol: 'Closer', color: '#E11822', inicial: 'J',
      stats: [
        { l: 'Leads en cartera', v: '2' },
        { l: 'Ganados (30d)', v: '2', good: true },
        { l: 'Tasa de cierre', v: '100%', good: true },
        { l: 'Cash collected', v: '$3,500' },
      ],
      urgentes: [
        { t: 'Llamada de cierre con Daniel Ramírez', badge: 'Hoy 3:00pm', tono: 'hoy', urge: true },
      ],
      semana: [
        { d: 'Lun', items: ['Seguimiento Daniel'] },
        { d: 'Mar', items: ['Llamada de cierre', true] },
        { d: 'Mié', items: [] },
        { d: 'Jue', items: ['Reunión equipo', true] },
        { d: 'Vie', items: ['Reporte semanal'] },
      ],
      leads: [
        { n: 'Daniel Ramírez', f: '$2,997 pactado', etapa: 'Ganado' },
        { n: 'Rodrigo Ayala', f: 'Meta Ads', etapa: 'Cita realizada' },
      ],
    },
    santi: {
      nombre: 'Santiago Durán', rol: 'Media Buyer · Admin', color: '#1B8A4C', inicial: 'S',
      stats: [
        { l: 'Tareas pendientes', v: '5' },
        { l: 'Invertido (mes)', v: '$916' },
        { l: 'ROAS', v: '6.6x', good: true },
        { l: 'Cash collected', v: '$6,000', good: true },
      ],
      urgentes: [
        { t: 'Subir creativos nuevos a campaña "WhatsApp"', badge: 'Vence hoy', tono: 'hoy', urge: true },
        { t: 'Revisar CPL de campaña "Leads" (subió 20%)', badge: 'Vence mañana', tono: 'vence', urge: true },
      ],
      semana: [
        { d: 'Lun', items: ['Revisión de campañas'] },
        { d: 'Mar', items: ['Subir creativos'] },
        { d: 'Mié', items: ['Reunión con Alejo', true] },
        { d: 'Jue', items: [] },
        { d: 'Vie', items: ['Reporte de métricas', true] },
      ],
      leads: null, // admin ve Ventas completo, no solo "sus" leads — se indica abajo
    },
  };

  let actual = 'omar';

  function iniciales(nombre) { return nombre.trim().split(/\s+/).slice(0,2).map(p=>p[0]).join('').toUpperCase(); }

  function renderSwitcher() {
    const el = document.getElementById('switcher');
    el.innerHTML = Object.entries(PERSONAS).map(([id, p]) => `
      <button class="${id===actual?'on':''}" onclick="elegir('${id}')">
        <span class="av" style="background:${p.color}">${p.inicial}</span>${p.nombre.split(' ')[0]}
      </button>
    `).join('');
  }

  function elegir(id) { actual = id; render(); }

  function render() {
    renderSwitcher();
    const p = PERSONAS[actual];
    document.getElementById('pAvatar').style.background = p.color;
    document.getElementById('pAvatar').textContent = iniciales(p.nombre);
    document.getElementById('pNombre').textContent = p.nombre;
    document.getElementById('pSub').textContent = p.rol + ' — ve solo lo suyo en esta cuenta';

    const stats = `<div class="cajon-section"><div class="stat-row">
      ${p.stats.map(s => `<div class="stat"><div class="l">${s.l}</div><div class="v ${s.good?'good':''}">${s.v}</div></div>`).join('')}
    </div></div>`;

    const urgentes = `<div class="cajon-section">
      <div class="titulo"><h2>🔥 Entregas urgentes — hoy y mañana</h2><span class="n">${p.urgentes.length}</span></div>
      <div class="lista">
        ${p.urgentes.length ? p.urgentes.map(u => `
          <div class="fila"><span class="dot urge"></span>
            <div class="titulo-f"><b>${u.t}</b></div>
            <span class="badge ${u.tono}">${u.badge}</span>
          </div>`).join('') : '<div class="vacio">Nada urgente — al día.</div>'}
      </div>
    </div>`;

    const semana = `<div class="cajon-section">
      <div class="titulo"><h2>📅 Mi semana</h2></div>
      <div class="grid-semana">
        ${p.semana.map((d, i) => `
          <div class="dia ${i===1?'hoy':''}">
            <div class="d-label">${d.d}${i===1?' · hoy':''}</div>
            ${d.items.filter(x=>x!==true).map(it => `<div class="item ${d.items.includes(true)&&it===d.items[d.items.length-2]?'reunion':''}">${it}</div>`).join('') || '<div class="item" style="opacity:.4">—</div>'}
          </div>`).join('')}
      </div>
    </div>`;

    const leadsSection = p.leads ? `<div class="cajon-section">
      <div class="titulo"><h2>💰 Mis leads (Ventas)</h2><span class="n">${p.leads.length}</span></div>
      <div class="lista">
        ${p.leads.map(l => `
          <div class="fila"><span class="dot ${l.etapa==='Ganado'?'ok':'urge'}"></span>
            <div class="titulo-f"><b>${l.n}</b><div class="meta">${l.f}</div></div>
            <span class="badge ${l.etapa==='Ganado'?'nuevo':'vence'}">${l.etapa}</span>
          </div>`).join('')}
      </div>
    </div>` : `<div class="cajon-section">
      <div class="titulo"><h2>💰 Ventas</h2></div>
      <div class="vacio">Admin del cliente: ve el pipeline completo de Alejo (no solo lo propio) — igual que Métricas y Finanzas.</div>
    </div>`;

    document.getElementById('contenido').innerHTML = stats + urgentes + semana + leadsSection;
  }

  render();
</script>
